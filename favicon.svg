<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Circle background -->
  <circle cx="50" cy="50" r="50" fill="url(#grad)"/>
  
  <!-- Code brackets style -->
  <g fill="white" font-family="Courier, monospace" font-size="48" font-weight="bold" text-anchor="middle">
    <!-- Left bracket -->
    <text x="25" y="65" opacity="0.9">&lt;</text>
    
    <!-- AZ monogram -->
    <text x="50" y="65" font-size="40" font-weight="bold">AZ</text>
    
    <!-- Right bracket -->
    <text x="75" y="65" opacity="0.9">&gt;</text>
  </g>
  
  <!-- Decorative line -->
  <line x1="20" y1="80" x2="80" y2="80" stroke="white" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
</svg>